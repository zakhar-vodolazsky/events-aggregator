name: Code checks and deploy

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Check code
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

  build:
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      repo: ${{ steps.repo.outputs.repo }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository name
        id: repo
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "repo=${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.repo }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Send deploy request
        env:
          LMS_API_KEY: ${{ secrets.LMS_API_KEY }}
          IMAGE: ghcr.io/${{ needs.build.outputs.repo }}:${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$LMS_API_KEY" ]; then
            echo "Add the LMS_API_KEY repository secret before deploying."
            exit 1
          fi
          jq -n --arg image "$IMAGE" --arg repository "$REPOSITORY" \
            '{image: $image, repository: $repository}' > payload.json
          HTTP_CODE=$(curl --silent --show-error --connect-timeout 10 --max-time 60 \
            -o response.txt -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -H "X-API-Key: $LMS_API_KEY" \
            --data-binary @payload.json \
            https://lms.python-labs.ru/api/deploy-requests)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Deploy request failed with status code $HTTP_CODE"
            cat response.txt
            exit 1
          fi
